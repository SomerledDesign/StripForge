# StripForge board config for Kevin's X56 stripboard: 24 strips (A-X) of 56 holes each,
# which is 142.24 x 60.96 mm of holes at 2.54 mm. See Sketch.md §4.1 and §4.2.
# Usage: stripforge analyze <board>.kicad_pcb --config examples/x56.toml
#
# rows, cols and origin_mm are all given, so the grid does not come from Edge.Cuts. The origin
# is the TPI fixture's first hole; move it to wherever hole A1 sits in your board file. Parts
# outside A1-X56 are reported as off board.
rows = 24                    # strips A..X
cols = 56                    # holes 1..56 along each strip
origin_mm = [51.27, 51.27]   # centre of hole A1 (col 0, row 0)
pitch_mm = 2.54
# Strip width: 1.8 mm, measured with calipers on Kevin's X56 board (2026-09-27). If you change it,
# regenerate the DRC rules to match: python3 rules/gen_dru.py --strip-width <w>
strip_width_mm = 1.8
cut_style = "auto"           # hole | knife | auto (hole where a free hole exists, else knife + warning)
snap_tol_mm = 0.15
cut_marker_layer = "User.1"
offboard_refs = []   # pin-header wire pads for switches/battery are ON-board; list true off-board refs here
# Slotted parts: a listed part's pad may sit up to slot_max_mm off its hole along the strip (and
# within snap_tol_mm across it); the report then says how far to file each end hole, e.g. for the
# BH23APC: "file hole U16 0.025" (0.635 mm) toward U17 (toward the part centre)". Place the part
# with its footprint origin on a hole so both ends are filed the same (analyze warns otherwise).
# Parts with big pads (a slide switch's 2.9 mm blade pads): knife cuts only, clear of the pads.
# knife_cuts = ["SW2"]
# After planning, cut each net piece back to its last used hole when that frees this many holes.
# trim_pieces = true
# trim_min_free = 4
slotted = ["BT1"]            # MPD BH23APC battery holder: slot centres 32.385 mm apart, pins seat 31.75 mm
slot_max_mm = 1.0
# slot_max_mm_by_ref = { BT1 = 0.5 }
# Parts not on the stripboard (panel-mounted, hand-wired): not snapped, no strips for their pads,
# listed as "wired off-board" on the build sheet. (offboard_refs above is the older name.)
# skip = ["SW3"]

# Bent legs, the "Beckham tolerance" (bend it like Beckham): a part whose legs can be bent onto
# the holes may be up to this many mm off them, in any direction, instead of snap_tol_mm (across
# the strip for a slotted part). 6 mil = 0.1524 mm. Max 0.5 mm; over 0.3 mm warns. Tables go
# after the top-level keys; each table's keys run to the next [table].
# [bend]
# SW2 = 0.16   # DPDT slide switch: 312 mil rows on 300 mil holes, 6 mil off per row

# Wire links: the longest link the planner may propose (mm; default 81.28 = 32 pitches). Links run
# from any free hole: down a column, along a strip, on a diagonal (a rotated Link_P* when the
# length is whole pitches, else an off-pitch Link_D*), or two links meeting on a bare bus strip.
# max_link_mm = 81.28
# diagonal_links = true
# off_pitch_links = true      # false: diagonals only when the length is a whole number of pitches
# bus_strips = true
# Build draws every free stripboard hole (plated, on its strip's net; hole cuts bare).
# draw_holes = true
# hole_drill_mm = 1.0

# Your own cuts and links, kept exactly where they are (StripForge fills in the rest). The same as
# moving CUT markers / W links in the built board and building again; respect_edits = false makes
# a build ignore the board's markers and links (not this table). Keep [manual] after the top-level
# keys, like [drc].
# respect_edits = true
# [manual]
# links = ["J16-T16"]        # wire link from hole J16 to hole T16
# cuts = ["J15", "C34-C35"]  # hole cut at J15; knife cut between C34 and C35
# no_cut = ["J17"]           # never cut at J17

# DRC filters for `stripforge drc` and the plugin's Run DRC. Everything filtered is still counted
# in the report ("filtered (config): ..."). Keep this table last in the file (TOML tables end the
# top-level keys). Type names are KiCad 10's DRC "type" values, e.g. silk_overlap, silk_over_copper,
# silk_edge_clearance, courtyards_overlap.
# [drc]
# ignore = ["silk_overlap", "silk_over_copper", "silk_edge_clearance"]   # board-wide
# # courtyard overlaps (courtyards_overlap, pth_/npth_inside_courtyard) accepted for exactly these
# # reference pairs, order-insensitive; any other overlap is still reported
# allow_overlap = [["J2", "C2"], ["J2", "C3"]]

# StripForge board config for the ATtiny10 TPI fixture (examples/tpi-fixture).
# See Sketch.md §4.1.
# Usage: stripforge analyze examples/tpi-fixture/ATtiny10_TPI_Fixture.kicad_pcb --config examples/stripboard.toml
#
# rows, cols and origin_mm are optional: leave them out and StripForge derives the grid from the
# board's Edge.Cuts outline, with the first hole hole_inset_mm (default: half a pitch) in from
# the top-left corner. The values below are what the fixture's 30x25-hole outline gives.
rows = 25
cols = 30
origin_mm = [51.27, 51.27]   # centre of hole (col 0, row 0)
pitch_mm = 2.54
# Strip width: 1.8 mm, measured with calipers on Kevin's X56 board (2026-09-27). If you change it,
# regenerate the DRC rules to match: python3 rules/gen_dru.py --strip-width <w>
strip_width_mm = 1.8
cut_style = "auto"           # hole | knife | auto (hole where a free hole exists, else knife + warning)
snap_tol_mm = 0.15
cut_marker_layer = "User.1"
offboard_refs = []   # pin-header wire pads for switches/battery are ON-board; list true off-board refs here
slotted = []         # refs whose pads may be filed into short slots along the strip (see x56.toml)
slot_max_mm = 1.0

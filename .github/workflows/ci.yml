name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04, which has no Python 3.9 for setup-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]  # 3.9 = KiCad 10's bundled Python (plugin runtime)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -v
